plugins { id 'com.android.application' }
android {
    namespace 'app.lifeos.capture'
    compileSdk 35
    defaultConfig {
        applicationId 'app.lifeos.capture'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'LIFEOS_URL', '"https://lifeos-two-kohl-18.vercel.app"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('LIFEOS_KEYSTORE')) {
                storeFile file(System.getenv('LIFEOS_KEYSTORE'))
                storePassword System.getenv('LIFEOS_STORE_PASSWORD')
                keyAlias 'lifeos-captura'
                keyPassword System.getenv('LIFEOS_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.10.0'
}
